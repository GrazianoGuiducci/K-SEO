[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kseo-local-reference"
version = "0.1.0.dev0"
description = "Local reference receiver for K-SEO cognitive source work"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kseo = "kseo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
